# Rules used: big gap is 20 points or more (either direction), staff low is under 50% agree.
#
# Correction after the first run: q07 staff average is (8*1 + 14*2 + 10*3 + 6*4 + 2*5) / 40 = 100 / 40 = 2.5. The key had 2.4,
# an arithmetic slip copied from q03. The tool was right.
